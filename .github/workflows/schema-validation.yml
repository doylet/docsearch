name: Schema Validation and Breaking Change Detection

on:
  push:
    branches: [ main ]
    paths:
      - 'api/schemas/**'
      - 'api/public/**'
      - 'crates/zero-latency-api/**'
      - 'redocly.yaml'
      - '.github/workflows/schema-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/schemas/**'
      - 'api/public/**'
      - 'crates/zero-latency-api/**'
      - 'redocly.yaml'
      - '.github/workflows/schema-validation.yml'

env:
  CARGO_TERM_COLOR: always
  OPENAPI_GENERATOR_VERSION: '7.8.0'
  OASDIFF_VERSION: '1.33.0'

jobs:
  schema-validation:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # openapi-generator-cli needs Java, which ubuntu-latest provides.
    - name: Install OpenAPI tools
      run: |
        npm install -g @redocly/cli@2 @openapitools/openapi-generator-cli
        openapi-generator-cli version-manager set "$OPENAPI_GENERATOR_VERSION"
        curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin oasdiff

    - name: Validate OpenAPI Schema
      run: redocly lint api/public/openapi.yaml --format=github-actions

    - name: Test Schema Generation
      run: |
        openapi-generator-cli generate \
          -i api/public/openapi.yaml \
          -g rust \
          -o /tmp/test-generation \
          --additional-properties packageName=test-api

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    # With openapi-generator-cli on PATH, build.rs generates real types
    # instead of the placeholders used in the main CI job.
    - name: Test Generated Code Compilation
      working-directory: crates/zero-latency-api
      run: cargo build --release

    # Breaking changes are reported as warnings, not failures, by design: a
    # breaking change may be intended, and the reviewer decides whether the
    # API version needs bumping.
    - name: Breaking Change Detection
      if: github.event_name == 'pull_request'
      run: |
        if ! git show "origin/${{ github.base_ref }}:api/public/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
          echo "Base OpenAPI spec not found, skipping breaking change detection"
          exit 0
        fi

        echo "API changes:"
        oasdiff changelog /tmp/base-openapi.yaml api/public/openapi.yaml

        if ! oasdiff breaking /tmp/base-openapi.yaml api/public/openapi.yaml --fail-on ERR --format githubactions; then
          echo "::warning::Breaking changes detected in the API schema. Review them and bump the API version if needed."
        fi

  integration-test:
    name: Integration Test with Generated Types
    runs-on: ubuntu-latest
    needs: schema-validation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js for OpenAPI tools
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install OpenAPI Generator
      run: |
        npm install -g @openapitools/openapi-generator-cli
        openapi-generator-cli version-manager set "$OPENAPI_GENERATOR_VERSION"

    - name: Build and Test All Crates
      run: |
        echo "Building workspace with generated types..."
        cargo build --workspace --release

        echo "Running tests..."
        cargo test --workspace
