name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    # Clippy and tests run with --all-features so feature-gated code can't rot;
    # the release build uses default features, which is what ships.
    #
    # Clippy allows dead_code until the dead-code cleanup change removes the
    # unused items; every other warning is an error.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code

    - name: Run tests
      run: cargo test --workspace --all-features

    - name: Check documentation
      run: cargo doc --workspace --no-deps

  # The main test job never touches the network or the model. This job runs the
  # ignored ONNX tests against the real bge-small-en-v1.5, cached per revision.
  model-tests:
    name: Embedding Model Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Read pinned model revision
      id: model
      run: |
        revision=$(sed -n 's/^pub const BGE_REVISION: &str = "\(.*\)";/\1/p' \
          services/doc-indexer/src/infrastructure/persistence/embeddings/model_files.rs)
        test -n "$revision"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Cache model files
      uses: actions/cache@v4
      with:
        path: ~/.zero-latency/models
        key: bge-small-en-v1.5-${{ steps.model.outputs.revision }}

    # Verifies cached files; downloads only on a cache miss
    - name: Fetch model
      run: cargo run --release -p doc-indexer -- --fetch-model

    - name: Run ONNX tests
      run: |
        export ZL_EMBEDDING_LOCAL_MODEL_PATH="$HOME/.zero-latency/models/bge-small-en-v1.5"
        cargo test --release -p doc-indexer -- --ignored onnx

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Advisories, licenses, bans and sources, as configured in deny.toml.
    - name: Run cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        log-level: warn
        command: check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # The root lockfile covers the apps/* workspaces.
    - name: Install dependencies
      run: npm ci

    # ESLint is not run yet: its config loads under eslint 9 but reports
    # errors that need fixing first.
    - name: Type-check
      working-directory: apps/frontend
      run: npx tsc --noEmit

    - name: Build
      working-directory: apps/frontend
      run: npm run build

    - name: Audit production dependencies
      working-directory: apps/frontend
      run: npm audit --omit=dev --audit-level=high

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build release
      run: cargo build --release --workspace

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docsearch-binaries
        path: |
          target/release/doc-indexer
          target/release/mdx
        if-no-files-found: error
        retention-days: 30

  # Builds the image on every run so the Dockerfile stays honest. Pushing to
  # GHCR and the deploy jobs are opt-in: set the repository variable
  # DEPLOY_ENABLED=true once the registry, Kubernetes secrets
  # (KUBE_CONFIG_STAGING, KUBE_CONFIG_PRODUCTION), SLACK_WEBHOOK_URL and the
  # staging/production environments exist.
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    env:
      PUSH: ${{ github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      if: env.PUSH == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: env.PUSH == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    # Multi-arch builds run under QEMU and are slow, so only build arm64 when
    # the image is actually published.
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to staging
      run: |
        # Update image tag in deployment
        sed -i "s|docsearch:latest|ghcr.io/${{ github.repository }}:main|g" k8s/deployment.yaml

        # Apply secrets (if not already present)
        kubectl apply -f docker/secrets/k8s-secrets.yaml --dry-run=client -o yaml | kubectl apply -f -

        # Deploy application
        kubectl apply -f k8s/

        # Wait for rollout
        kubectl rollout status deployment/docsearch -n default --timeout=600s

        # Verify deployment
        kubectl get pods -l app=docsearch -n default

    - name: Run smoke tests
      run: |
        # Wait for service to be ready
        kubectl wait --for=condition=ready pod -l app=docsearch -n default --timeout=300s

        # Get service URL
        STAGING_URL=$(kubectl get ingress docsearch-internal-ingress -o jsonpath='{.spec.rules[0].host}')

        # Run health check
        curl -f "http://${STAGING_URL}/health"
        echo "Staging deployment successful!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'release'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Deploy to production
      run: |
        # Extract version from release tag
        VERSION=${GITHUB_REF#refs/tags/}

        # Update image tag in deployment
        sed -i "s|docsearch:latest|ghcr.io/${{ github.repository }}:${VERSION}|g" k8s/deployment.yaml

        # Apply secrets (if not already present)
        kubectl apply -f docker/secrets/k8s-secrets.yaml --dry-run=client -o yaml | kubectl apply -f -

        # Deploy application
        kubectl apply -f k8s/

        # Wait for rollout
        kubectl rollout status deployment/docsearch -n default --timeout=600s

        # Verify deployment
        kubectl get pods -l app=docsearch -n default

    - name: Run production smoke tests
      run: |
        # Wait for service to be ready
        kubectl wait --for=condition=ready pod -l app=docsearch -n default --timeout=300s

        # Get service URL (assuming production ingress is configured)
        PROD_URL=$(kubectl get ingress docsearch-ingress -o jsonpath='{.spec.rules[0].host}')

        # Run health check
        curl -f "https://${PROD_URL}/health"
        echo "Production deployment successful!"

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "🚀 Docsearch ${{ github.event.release.tag_name }} deployed to production!"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: always()
