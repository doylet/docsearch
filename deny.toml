# cargo-deny policy, run in CI by EmbarkStudios/cargo-deny-action.
# Local check: `cargo deny check`. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# All features, matching what CI lints and tests, so optional dependencies
# (`cloud`, `tantivy`) are audited too.
all-features = true

[advisories]
# Vulnerabilities, unsound and unmaintained crates are denied by default.
# Every ignore needs a reason and a review date.
#
# None of these has a semver-compatible fix; each needs a major upgrade of a
# direct dependency. Review all by 2027-01-04.
ignore = [
    # Vulnerabilities
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2.x via prometheus 0.13 / opentelemetry-prometheus 0.14; fix needs protobuf 3 (prometheus upgrade). Review by 2027-01-04" },
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via hyper 0.14 (reqwest 0.11 in mdx, jsonrpc-http-server 18); fixed only in h2 0.4. Review by 2027-01-04" },
    # Unsound
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12, direct (embedded feature) and via tantivy 0.22; fix needs lru 0.16+. Review by 2027-01-04" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12, direct (embedded feature) and via tantivy 0.22; fix needs lru 0.18.2+. Review by 2027-01-04" },
    # Unmaintained, no fixed release exists
    { id = "RUSTSEC-2020-0016", reason = "net2 via jsonrpc-http-server 18. Review by 2027-01-04" },
    { id = "RUSTSEC-2024-0384", reason = "instant via tantivy 0.22 and parking_lot 0.11 (jsonrpc-http-server). Review by 2027-01-04" },
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) via tokenizers 0.15. Review by 2027-01-04" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix via indicatif 0.17 (mdx, tokenizers). Review by 2027-01-04" },
    { id = "RUSTSEC-2025-0123", reason = "opentelemetry-jaeger 0.20, direct in doc-indexer; replace with an OTLP exporter. Review by 2027-01-04" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 1.x via reqwest 0.11 in mdx. Review by 2027-01-04" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25 via lopdf 0.42 (pdf-extract 0.12); no maintained release, lopdf would need to move to skrifa. Review by 2027-01-04" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x, direct in doc-indexer (embedded feature). Review by 2027-01-04" },
]

[licenses]
# Built from the dependency tree on 2026-10-04, not a generic list.
# MPL-2.0 is weak (file-level) copyleft: colored, htmlescape, option-ext.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates with `publish = false` don't need a license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
